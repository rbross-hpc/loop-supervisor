[project]
name = "loop-supervisor"
version = "0.1.0"
description = "Headless supervisor that orchestrates an OpenCode planner/architect/builder/auditor loop over Git worktrees."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "textual>=6.0,<7",
  "rich>=13.9,<15",
]

[project.scripts]
loop-supervisor = "loop_supervisor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loop_supervisor = [
  "_skeleton/**/*",
  "_skeleton/.gitignore",
  "_skeleton/.env.example",
  "_skeleton/.opencode/agents/*.md",
  "_skeleton/.opencode/agents/*.tmpl",
  "_skills/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An exception escaping a worker thread (or a __del__/callback, for the
# unraisable case) is otherwise downgraded to an ignorable warning: a test
# can pass while its thread silently raised. This let a characterization
# test in test_runtime.py pass while actually exercising the wrong code
# path (see the commit fixing it). Not a blanket `filterwarnings =
# ["error"]": the suite currently emits unrelated ResourceWarnings that
# would fail it immediately (see docs/plans/2026-08-22-post-lifecycle-fix-
# backlog.md item 23).
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str+Enum is intentional for JSON-serializable enums

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
strict = false
ignore_missing_imports = true
