[project]
name = "loop-supervisor"
version = "0.1.0"
description = "Headless supervisor that orchestrates an OpenCode planner/architect/builder/auditor loop over Git worktrees."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
loop-supervisor = "loop_supervisor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str+Enum is intentional for JSON-serializable enums

[tool.mypy]
python_version = "3.11"
packages = ["loop_supervisor"]
strict = false
ignore_missing_imports = true
